<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stoke Book Festival</title>
    <link rel="stylesheet" href="./css/style.css" />

    <!-- NATIVE JS -->

    <script src="./js/mapEventsCards.js" defer></script>
    <script src="./js/openCloseCardDetails.js" defer></script>
  
    <script src="./js/createFooterFan.js" defer></script>
      <script src="./js/animations.js" defer></script>

    <!-- GSAP IMPORTS -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <!-- ScrollSmoother requires ScrollTrigger -->

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollToPlugin.min.js"></script>
  </head>
  <body class="bg-background text-foreground">
    <header><div class="endcap-bottom-white absolute bottom-0"></div></header>
    <main>
      <div class="flex h-screen w-screen flex-col items-center justify-center overflow-hidden">
        <h1 class="font-author text-5xl">Stoke Book Festival</h1>
        <p class="mt-4 text-lg">More info coming soon...</p>
      </div>

      <!-- === EVENTS SECTION === -->
      <div class="mx-auto mb-24 flex max-w-7xl flex-row items-center justify-center space-x-8">
        <a
          aria-label="Skip to author Events"
          href="#author-events"
          class="scroll-to-section button bg-purple hover:bg-purple/90 -rotate-3 text-3xl text-white"
        >
          Author events
        </a>
        <a
          aria-label="Skip to workshops and events"
          href="#workshop-events"
          class="scroll-to-section button bg-green/30 hover:bg-green/40 rotate-3 text-3xl text-white"
        >
          Workshops & Events
        </a>
        <a
          aria-label="Skip to family Events"
          href="#family-events"
          class="scroll-to-section button bg-orange/30 hover:bg-orange/40 -rotate-2 px-20 text-3xl text-white"
        >
          Family
        </a>
      </div>
      <!-- === AUTHOR EVENTS === -->
      <section id="author-events" class="mb-22 px-3">
        <h2 class="section-title text-purple text-center">Author Events</h2>
        <div id="author-cards-grid" class="card-grid"></div>
      </section>

      <!-- === WORKSHOP EVENTS === -->
      <section id="workshop-events" class="mb-22 px-3">
        <h2 class="section-title text-green text-center">Workshops & Events</h2>
        <div id="workshop-cards-grid" class="card-grid"></div>
      </section>

      <!-- === FAMILY EVENTS === -->
      <section id="family-events" class="mb-22 px-3">
        <h2 class="section-title text-orange text-center">Family Events</h2>
        <div id="family-cards-grid" class="card-grid"></div>
      </section>

      <section id="what-to-expect">
        <div class="bg-navy relative h-98">
          <div class="endcap-top-white absolute"></div>
        </div>
        <!-- <div class="endcap-bottom-navy"></div> -->
      </section>
    </main>
    <footer class="bg-yellow relative w-full overflow-hidden pt-18 pb-17.5">
      <div class="endcap-top-navy absolute inset-0 z-50"></div>
      <div class="absolute inset-0 z-0 size-full overflow-hidden">
        <div class="footer-fan-container">
        </div>
      </div>
